spring:
  application:
    name: shop
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
  h2:
    console:
      enabled: true
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

shop:
  currency: "USD"
  tax-rate: 0.10
  low-stock-threshold: 25

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    app:
      name: ${spring.application.name}
      version: "@project.version@"
      java:
        version: "@java.version@"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId}] %logger{36} : %m%n"
  level:
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
    edu.itc.se.shop: DEBUG
